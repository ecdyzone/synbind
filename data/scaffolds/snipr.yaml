# SNIPR scaffold (Synthetic Intramembrane Proteolysis Receptor).
#
# ⚠️ All part sequences are TODO. Do NOT fabricate them — see data/README.md.
#
# Later-generation scaffold with a redesigned core. Reported advantages over
# synNotch: improved dynamic range, lower ligand-independent signalling, and
# greater tolerance of ligand presentation format — including responsiveness to
# soluble factors under some configurations.

schema_version: 1

id: snipr_v1
display_name: "SNIPR"

description: >
  Synthetic intramembrane proteolysis receptor. Redesigned core with broader
  tolerance of ligand presentation format.

compatible_modalities:
  - membrane_bound
  - soluble

modality_caveat: >
  Soluble responsiveness is configuration-dependent and less well established
  than membrane-bound activation. Surface this as a caution to the user rather
  than presenting soluble support as equivalent to membrane-bound support.

binder_constraints:
  accepted_formats: [antibody, nanobody, receptor_ectodomain]
  single_chain_required: true
  fusion_terminus: N
  max_binder_length_aa: null  # TODO: confirm a practical limit
  default_linker_id: g4s_x3

binder_insertion_index: 1

