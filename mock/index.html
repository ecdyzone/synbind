<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>synbind — interface mock</title>
<style>
/* ─────────────────────────────────────────────────────────────
   synbind UI mock. Hand-written CSS, no framework, no build step.
   Opens from file://. See ../MOCK.md — all data here is invented.
   ───────────────────────────────────────────────────────────── */

:root {
  --bg:        #f6f7f9;
  --surface:   #ffffff;
  --surface-2: #f0f2f5;
  --line:      #dfe3e8;
  --line-soft: #eaedf1;
  --text:      #1a1d21;
  --text-2:    #565e68;
  --text-3:    #858e99;
  --accent:    #2f5fd0;
  --accent-bg: #eaf0fd;
  --ok:        #1a7f52;
  --ok-bg:     #e7f4ed;
  --warn:      #9a6410;
  --warn-bg:   #fdf3e0;
  --fail:      #b4261f;
  --fail-bg:   #fdecea;
  --mock:      #8a5a00;
  --mock-bg:   #fff4d6;
  --mock-line: #eccb7a;

  --seg-sp:     #8993a1;
  --seg-binder: #2f5fd0;
  --seg-core:   #128a7d;
  --seg-tmd:    #b8791a;
  --seg-output: #7a4bbd;

  --radius: 10px;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #14171b;
    --surface:   #1c2026;
    --surface-2: #232830;
    --line:      #333a44;
    --line-soft: #272d35;
    --text:      #e8eaed;
    --text-2:    #a8b1bd;
    --text-3:    #7c8593;
    --accent:    #7aa2f7;
    --accent-bg: #1e2a44;
    --ok:        #5ec98f;
    --ok-bg:     #17301f;
    --warn:      #e0b062;
    --warn-bg:   #332612;
    --fail:      #f08078;
    --fail-bg:   #35191a;
    --mock:      #f0cd7d;
    --mock-bg:   #332a12;
    --mock-line: #5c4a1e;

    --seg-sp:     #98a2b3;
    --seg-binder: #7aa2f7;
    --seg-core:   #4bc4b4;
    --seg-tmd:    #e0b062;
    --seg-output: #b48ae8;

    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto,
        "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
  html { scroll-behavior: auto; }
}

.wrap { max-width: 900px; margin: 0 auto; padding: 0 20px 96px; }

/* ── Mock badge ───────────────────────────────────────────── */

.mockbar {
  position: sticky; top: 0; z-index: 40;
  background: var(--mock-bg);
  border-bottom: 1px solid var(--mock-line);
  color: var(--mock);
  font-size: 12.5px; font-weight: 600;
  padding: 7px 20px;
  display: flex; gap: 8px; align-items: center; justify-content: center;
  text-align: center;
}
.mockbar span { font-weight: 500; }

/* ── Masthead ─────────────────────────────────────────────── */

header.mast { border-bottom: 1px solid var(--line); background: var(--surface); }
.mast-in {
  max-width: 900px; margin: 0 auto; padding: 22px 20px 20px;
  display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
}
.logo { font-size: 21px; font-weight: 650; letter-spacing: -0.02em; }
.logo b { color: var(--accent); font-weight: 650; }
.tagline { color: var(--text-2); font-size: 14px; }

/* ── Cards & steps ────────────────────────────────────────── */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.step { margin-top: 24px; }
.step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.step-num {
  width: 21px; height: 21px; flex: none;
  border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--text-2);
  font-size: 11.5px; font-weight: 700;
  display: grid; place-items: center;
}
.step-head h2 { font-size: 14px; }
.step-head .why { margin-left: auto; }

/* ── Target picker ────────────────────────────────────────── */

.picker { position: relative; }
.picker input {
  width: 100%; padding: 13px 15px;
  font: inherit; font-size: 15.5px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.picker input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.picker input::placeholder { color: var(--text-3); }

.menu {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 30;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.menu-note {
  padding: 9px 14px;
  background: var(--warn-bg); color: var(--warn);
  font-size: 12.5px; font-weight: 500;
  border-bottom: 1px solid var(--line-soft);
}
.opt {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  padding: 10px 14px;
  background: none; border: 0; border-bottom: 1px solid var(--line-soft);
  cursor: pointer;
}
.opt:last-child { border-bottom: 0; }
.opt:hover, .opt:focus-visible { background: var(--surface-2); }
.opt-name { font-weight: 600; }
.opt-sub { color: var(--text-3); font-size: 13px; }
.opt .chip { margin-left: auto; }

.empty { padding: 14px; color: var(--text-2); font-size: 14px; }

/* ── Chips ────────────────────────────────────────────────── */

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2.5px 9px;
  border-radius: 999px;
  font-size: 12px; font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line-soft);
}
.chip.soluble  { background: var(--accent-bg); color: var(--accent); border-color: transparent; }
.chip.membrane { background: var(--ok-bg);     color: var(--ok);     border-color: transparent; }

/* ── Selected bars ────────────────────────────────────────── */

.selected { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 13px 15px; }
.selected .who { font-weight: 650; font-size: 16px; }
.selected .acc { color: var(--text-3); font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.linkish {
  background: none; border: 0; padding: 0;
  color: var(--accent); font-size: 13px; font-weight: 500;
  cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
}
.selected .linkish { margin-left: auto; }

/* ── Host cell select ─────────────────────────────────────── */

.host { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 15px; }
.host select {
  font: inherit; font-size: 15px; color: var(--text);
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 11px; cursor: pointer; max-width: 100%;
}
.host select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.host .sub { color: var(--text-3); font-size: 13px; }

/* ── Scaffold cards ───────────────────────────────────────── */

.scaffolds { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .scaffolds { grid-template-columns: 1fr; } }

.scaf {
  text-align: left; cursor: pointer;
  padding: 14px 15px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 7px;
}
.scaf:hover { border-color: var(--text-3); }
.scaf[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg), var(--shadow); }
.scaf-name { font-weight: 650; font-size: 15.5px; }
.scaf-desc { color: var(--text-2); font-size: 13.5px; }

/* ── Verdict ──────────────────────────────────────────────── */

.verdict { margin-top: 24px; overflow: hidden; }
.verdict-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; }
.verdict.blocked .verdict-head { background: var(--fail-bg); }
.verdict.ok      .verdict-head { background: var(--ok-bg); }
.verdict.none    .verdict-head { background: var(--surface-2); }

.mark {
  width: 26px; height: 26px; flex: none; margin-top: 1px;
  border-radius: 50%; display: grid; place-items: center;
  font-size: 15px; font-weight: 700; color: #fff;
}
.blocked .mark { background: var(--fail); }
.ok .mark      { background: var(--ok); }
.none .mark    { background: var(--text-3); }

.verdict-head h2 { font-size: 17px; }
.blocked .verdict-head h2 { color: var(--fail); }
.ok .verdict-head h2      { color: var(--ok); }
.verdict-head p { margin-top: 5px; font-size: 14.5px; max-width: 64ch; }

.because { padding: 16px 20px 18px; }
.because p { color: var(--text-2); font-size: 14px; max-width: 68ch; }
.because p + p { margin-top: 9px; }

.fixbar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 15px 20px;
  background: var(--surface-2);
  border-top: 1px solid var(--line);
}
.fixbar .txt { font-size: 14px; color: var(--text-2); }
.fixbar .txt b { color: var(--text); font-weight: 650; }

.btn {
  padding: 9px 15px; border-radius: 8px;
  background: var(--accent); color: #fff;
  border: 1px solid transparent;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--text-2); border-color: var(--line); }
.btn.sm { padding: 6px 11px; font-size: 13px; }

/* ── Tabs ─────────────────────────────────────────────────── */

.tabs {
  display: flex; gap: 2px; padding: 0 20px;
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: var(--surface); overflow-x: auto;
}
.tab {
  padding: 12px 14px 10px;
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--text-2); font-size: 14px; font-weight: 550;
  cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.pane { padding: 20px; }

/* ── Recommendation ───────────────────────────────────────── */

.override {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin: -20px -20px 18px; padding: 11px 20px;
  background: var(--warn-bg); color: var(--warn);
  font-size: 13.5px; font-weight: 550;
}
.override .linkish { color: inherit; margin-left: auto; }

.rec-top { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.rec-name { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.rec-meta { color: var(--text-2); font-size: 13.5px; margin-top: 3px; }
.rec-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

.why-box {
  margin-top: 14px; padding: 14px 16px;
  background: var(--accent-bg);
  border-radius: var(--radius);
  font-size: 14.5px; line-height: 1.6;
  max-width: 68ch;
}

.sub { margin-top: 22px; }
.sub > h3 { font-size: 12.5px; color: var(--text-3); margin-bottom: 8px; letter-spacing: .04em; text-transform: uppercase; }

.finding { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 9px 0; }
.finding + .finding { border-top: 1px solid var(--line-soft); }
.dot {
  width: 16px; height: 16px; margin-top: 3px;
  border-radius: 50%; display: grid; place-items: center;
  font-size: 10px; font-weight: 800; color: #fff;
}
.dot.pass { background: var(--ok); }
.dot.warn { background: var(--warn); }
.f-title { font-weight: 600; font-size: 14.5px; }
.f-detail { color: var(--text-2); font-size: 13.5px; margin-top: 2px; max-width: 68ch; }

details.more { margin-top: 6px; }
.exportbar { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
details.more > summary {
  cursor: pointer; list-style: none;
  color: var(--accent); font-size: 13.5px; font-weight: 550;
  padding: 8px 0;
}
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "▸ "; }
details.more[open] > summary::before { content: "▾ "; }

.caveats { list-style: none; padding: 0; margin: 0; }
.caveats li { position: relative; padding: 6px 0 6px 22px; color: var(--text-2); font-size: 14px; max-width: 68ch; }
.caveats li::before {
  content: "!"; position: absolute; left: 0; top: 7px;
  width: 15px; height: 15px; border-radius: 50%;
  background: var(--warn-bg); color: var(--warn);
  font-size: 10px; font-weight: 800;
  display: grid; place-items: center;
}

/* ── Comparison ───────────────────────────────────────────── */

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 620px; }
th, td { text-align: left; padding: 11px 13px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { font-size: 11.5px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
tr.top td { background: var(--accent-bg); }
tr.chosen td { background: var(--warn-bg); }
td .nm { font-weight: 600; white-space: nowrap; }
td .sm { color: var(--text-3); font-size: 12.5px; }

.rank {
  display: inline-grid; place-items: center;
  width: 20px; height: 20px; border-radius: 5px;
  background: var(--surface-2); color: var(--text-2);
  font-size: 12px; font-weight: 700;
}
tr.top .rank { background: var(--accent); color: #fff; }

tr.row { cursor: pointer; }
tr.row:hover td { filter: brightness(.985); }
.chev { color: var(--text-3); font-size: 10px; display: inline-block; transition: transform .15s; }
tr.row[aria-expanded="true"] .chev { transform: rotate(90deg); }
td.detail { padding: 0; background: var(--surface-2); }
.detail-in { padding: 2px 18px 18px; }
.detail-in .why-box { background: var(--surface); }

.rejected { margin-top: 24px; }
.rej {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 11px 14px;
  border: 1px solid var(--line); border-left: 3px solid var(--fail);
  border-radius: 8px; background: var(--surface);
  margin-bottom: 8px;
}
.rej .x {
  width: 16px; height: 16px; margin-top: 3px; flex: none;
  border-radius: 50%; background: var(--fail); color: #fff;
  font-size: 10px; font-weight: 800; display: grid; place-items: center;
}
.rej .nm { font-weight: 600; font-size: 14.5px; }
.rej .rs { color: var(--text-2); font-size: 13.5px; margin-top: 2px; max-width: 68ch; }

.note { padding: 11px 14px; border-radius: 8px; background: var(--surface-2); color: var(--text-2); font-size: 13.5px; max-width: 70ch; }

/* ── Sequence ─────────────────────────────────────────────── */

.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; }
.leg { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); }
.swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; }

.seqbox { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow-x: auto; padding: 14px 16px; }
.seq { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.95; white-space: pre; }
.seq .ln { color: var(--text-3); user-select: none; }
.seq span[data-seg] { border-radius: 2px; padding: 2px 0; }

.sp     { color: var(--seg-sp); }
.binder { color: var(--seg-binder); font-weight: 700; background: var(--accent-bg); }
.core   { color: var(--seg-core); }
.tmd    { color: var(--seg-tmd); }
.output { color: var(--seg-output); }

pre.json {
  margin: 0; padding: 14px 16px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface-2);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px; line-height: 1.6;
  overflow-x: auto; color: var(--text-2);
}

/* ── Popover ──────────────────────────────────────────────── */

.why {
  background: none; border: 0; padding: 0;
  color: var(--accent); cursor: pointer;
  font-size: 13px; font-weight: 500;
  text-decoration: underline; text-underline-offset: 2px; text-decoration-style: dotted;
}
.why::before { content: "ⓘ "; text-decoration: none; }
.prov {
  background: none; border: 0; padding: 0;
  color: var(--accent); cursor: pointer;
  font-size: inherit; font-weight: 500;
  text-decoration: underline; text-underline-offset: 2px; text-decoration-style: dotted;
}
.prov::before { content: "ⓘ "; text-decoration: none; }

#pop {
  position: absolute; z-index: 60; display: none;
  width: min(340px, calc(100vw - 32px));
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 8px 30px rgba(16,24,40,.16);
  padding: 14px 15px;
}
#pop h4 { margin: 0 0 8px; font-size: 13px; }
#pop dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px; }
#pop dt { color: var(--text-3); }
#pop dd { margin: 0; word-break: break-word; }
#pop dd.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
#pop p { font-size: 13px; color: var(--text-2); line-height: 1.55; }

.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 80;
  background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 8px;
  font-size: 13.5px; font-weight: 500;
  box-shadow: 0 8px 30px rgba(0,0,0,.25);
  opacity: 0; pointer-events: none; transition: opacity .18s;
}
.toast.on { opacity: 1; }

footer.foot {
  margin-top: 36px; padding-top: 16px;
  border-top: 1px solid var(--line);
  color: var(--text-3); font-size: 12.5px;
  display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between;
}
footer.foot .build { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>

<div class="mockbar">⚠ MOCK <span>— a picture of the interface. Every sequence, ID and citation on this page is made up.</span></div>

<header class="mast">
  <div class="mast-in">
    <div class="logo">syn<b>bind</b></div>
    <div class="tagline">Design and validate a binder domain for a synthetic receptor.</div>
  </div>
</header>

<div class="wrap">

  <section class="step">
    <div class="step-head">
      <span class="step-num">1</span>
      <h2>What should the cell sense?</h2>
    </div>
    <div class="picker">
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Type a protein name — CD3, TGF-beta1, VEGF…" aria-label="Target protein">
      <div id="menu" class="menu" hidden></div>
    </div>
    <div id="selected"></div>
  </section>

  <section class="step" id="step2" hidden>
    <div class="step-head">
      <span class="step-num">2</span>
      <h2>Which cell will carry the receptor?</h2>
      <button class="why" data-pop="why_host">why this matters</button>
    </div>
    <div class="card host">
      <select id="host" aria-label="Host cell"></select>
      <span class="sub" id="hostSub"></span>
    </div>
  </section>

  <section class="step" id="step3" hidden>
    <div class="step-head">
      <span class="step-num">3</span>
      <h2>Which receptor scaffold?</h2>
    </div>
    <div class="scaffolds" id="scaffolds"></div>
  </section>

  <div id="result"></div>

  <footer class="foot">
    <span>synbind interface mock</span>
    <span class="build" id="build"></span>
  </footer>
</div>

<div id="pop" role="dialog" aria-label="Details"></div>
<div id="toast" class="toast" role="status"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   MOCK DATA — every value below is invented. See ../MOCK.md.
   ═══════════════════════════════════════════════════════════════ */

const BUILD = { tag: "mock-4", date: "2026-07-27" };

const POP = {
  why_host: { title: "Why the cell matters",
    text: "A binder can accidentally grab its own target on the cell it lives in. Then the receptor is switched on all the time, whatever else happens — and the experiment is dead before it starts. Which proteins sit on that surface depends entirely on the cell you use, so synbind needs to know it. It also decides whether the binder's origin matters: a mouse-derived framework is a problem in a transplanted cell and irrelevant in a dish." },

  tgfb1_uniprot: { title: "UniProt · P01137",
    fields: { Source:"UniProt", Accession:"P01137", Record:"TGFB1_HUMAN", Retrieved:"2026-07-21", Checked:"not yet" } },
  cd3e_uniprot: { title: "UniProt · P07766",
    fields: { Source:"UniProt", Accession:"P07766", Record:"CD3E_HUMAN", Retrieved:"2026-07-21", Checked:"not yet" } },

/* ═══ State ═══════════════════════════════════════════════════ */

const state = { target:null, host:HOSTS[0], scaffold:null, tab:"rec", open:new Set(), chosen:null };

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const modalityChip = m => m === "soluble"
  ? '<span class="chip soluble">floats free</span>'
  : '<span class="chip membrane">sits on a cell</span>';
const provBtn = (key, label) => `<button class="prov" data-pop="${key}">${esc(label)}</button>`;

/* ── Ranking. The number orders the list; it is never shown. ── */

function scoreOf(c) {
  let s = 1.0;
  s -= 0.10 * Math.min(c.liabilities, 3);
  if ((c.originClass === "murine" || c.originClass === "camelid") && state.host.transplanted) s -= 0.15;
  if (!c.structural) s -= 0.10;
  if (c.cocrystal) s += 0.10;
  s -= 0.05 * Math.max(0, Math.floor((c.binderLen - 300) / 50));
  return Math.max(0, Math.min(1, s));
}

function ranked() {
  const list = (CANDIDATES[state.target?.id] || []).map((c, i) => ({ c, i, s: scoreOf(c) }));
  list.sort((a, b) => b.s - a.s || a.i - b.i);
  return list.map((x, n) => ({ ...x.c, rank: n + 1 }));
}
const rejectedFor = () => REJECTED[state.target?.id] || [];

/* Origin finding depends on where the cell is going. */
function originFinding(c) {
  const nonHuman = c.originClass === "murine" || c.originClass === "camelid";
  if (!nonHuman) return { rule:"immunogenicity.origin", sev:"pass", title:`${c.origin} framework.`,
    detail: state.host.transplanted ? "Less visible to a recipient's immune system." : "" };
  if (!state.host.transplanted) return { rule:"immunogenicity.origin", sev:"pass",
    title:`${c.origin} framework — not an issue in ${state.host.name}.`,
    detail:"It would be, if these cells were going into a recipient." };
  return { rule:"immunogenicity.origin", sev:"warn", title:`${c.origin} framework, not human.`,
    detail:"Everything on the surface of a transplanted cell is visible to the recipient — the binder's framework included, not just the tip that touches the target." };
}

function modalityFinding(scaf) {
  const t = state.target;
  if (t.modality === "membrane_bound" && scaf.id === "synnotch") return { rule:"modality.compatible", sev:"pass",
    title:`${t.name} sits on a neighbouring cell — exactly what synNotch needs.`,
    detail:"Contact between the two cells provides the pull that switches it on." };
  if (t.modality === "membrane_bound") return { rule:"modality.compatible", sev:"pass",
    title:`SNIPR answers to a signal sitting on a neighbouring cell.`, detail:"" };
  return { rule:"modality.compatible", sev:"pass",
    title:`SNIPR can answer to a free-floating signal like ${t.name}.`,
    detail:"How well depends on the setup, and that is less firmly established than its response to signals held on a cell. Expect to try more than one arrangement." };
}

function allFindings(c, scaf) {
  const f = c.findings.slice();
  f.splice(2, 0, modalityFinding(scaf));
  f.push(originFinding(c));
  return f;
}

const q = $("#q"), menu = $("#menu");

function renderMenu() {
  const term = q.value.trim().toLowerCase();
  if (!term) { menu.hidden = true; return; }
  const hits = TARGETS.filter(x => x.name.toLowerCase().includes(term) ||
    x.gene.toLowerCase().includes(term) || x.aliases.some(a => a.includes(term)));
  menu.hidden = false;

  if (!hits.length) {
    menu.innerHTML = `<div class="empty">Nothing matching “${esc(q.value)}”. Try <b>CD3</b>, <b>TGF-β1</b>, <b>VEGF-A</b> or <b>CD47</b>.</div>`;
    return;
  }
  const ambiguous = hits.length > 1 && hits.every(h => h.gene.startsWith("CD3"));
  menu.innerHTML =
    (ambiguous ? `<div class="menu-note">“CD3” is three different proteins. Which one?</div>` : "") +
    hits.map(h => `<button class="opt" data-target="${h.id}">
        <span><span class="opt-name">${h.name}</span><span class="opt-sub"> · ${h.blurb}</span></span>
        ${modalityChip(h.modality)}</button>`).join("");
}

function pickTarget(id) {
  state.target = TARGETS.find(t => t.id === id);
  state.scaffold = null; state.tab = "rec"; state.open.clear(); state.chosen = null;
  q.value = state.target.name;
  menu.hidden = true;
  renderAll();
  $("#step2").scrollIntoView({ behavior:"smooth", block:"nearest" });
}

function renderSelected() {
  const t = state.target;
  $("#selected").innerHTML = !t ? "" : `
    <div class="card selected" style="margin-top:12px">
      <span class="who">${t.name}</span>
      ${modalityChip(t.modality)}
      <span class="acc">${t.gene}</span>
      ${t.prov ? provBtn(t.prov, "source") : ""}
      <button class="linkish" data-clear>change</button>
    </div>`;
}

/* ═══ Step 2 — host cell ═════════════════════════════════════ */

function renderHost() {
  $("#step2").hidden = !state.target;
  const sel = $("#host");
  if (!sel.options.length) {
    sel.innerHTML = HOSTS.map(h => `<option value="${h.id}">${h.name} — ${h.kind}</option>`).join("");
  }
  sel.value = state.host.id;
  const h = state.host;
  $("#hostSub").textContent = h.species
    ? `${h.species === "pig" ? "Pig" : "Human"} cells, ${h.transplanted ? "going into a recipient" : "staying in a dish"}`
    : "We will reason from the scaffold and binder alone";
}

/* ═══ Step 3 — scaffold ══════════════════════════════════════ */

function renderScaffolds() {
  $("#step3").hidden = !state.target;
  $("#scaffolds").innerHTML = SCAFFOLDS.map(s => `
    <button class="scaf" data-scaffold="${s.id}" aria-pressed="${state.scaffold === s.id}">
      <span class="scaf-name">${s.name}</span>
      <span class="scaf-desc">${s.desc}</span>
    </button>`).join("");
}

/* ═══ Result ═════════════════════════════════════════════════ */

function renderResult() {
  const box = $("#result");
  if (!state.target || !state.scaffold) { box.innerHTML = ""; return; }
  const scaf = SCAFFOLDS.find(s => s.id === state.scaffold);
  const selfBind = state.host.displays && state.host.displays[state.target.id];

  if (!scaf.modalities.includes(state.target.modality)) box.innerHTML = blockedModality(scaf);
  else if (!state.target.ready)                         box.innerHTML = noData();
  else if (selfBind)                                    box.innerHTML = blockedSelf(selfBind);
  else                                                  box.innerHTML = passView(scaf);
  box.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

function blockedModality(scaf) {
  const t = state.target;
  return `
  <section class="card verdict blocked">
    <div class="verdict-head">
      <span class="mark">✕</span>
      <div><h2>This pairing will not fire</h2>
      <p>${t.name} floats free between cells. ${scaf.name} only switches on when something pulls on it, and nothing floating can pull.</p></div>
    </div>
    <div class="because">
      <p>${scaf.name} needs its signal anchored to a neighbouring cell, so that the two cells moving apart stretch the receptor open. That stretch is what exposes the cut site.</p>
      <p><b>Nothing about this looks wrong.</b> It assembles, the cells make it, it reaches the surface — and it stays silent. That usually surfaces months later, as an experiment that quietly produced nothing.</p>
    </div>
    <div class="fixbar">
      <span class="txt">Use <b>SNIPR</b> instead — it is reported to answer free-floating signals.</span>
      <button class="btn" data-switch="snipr">Switch to SNIPR</button>
    </div>
  </section>`;
}

function blockedSelf(certainty) {
  const t = state.target, h = state.host;
  // Prefer a swap that keeps them in the same setting — another culture line
  // for a culture line, another primary cell for a primary cell.
  const free = x => x.displays && !x.displays[t.id];
  const alt = HOSTS.find(x => free(x) && x.transplanted === h.transplanted) || HOSTS.find(free);
  return `
  <section class="card verdict blocked">
    <div class="verdict-head">
      <span class="mark">✕</span>
      <div><h2>This receptor would be stuck on</h2>
      <p>${h.name} cells carry ${t.name} on their own surface. The binder would find its target at home, without any other cell involved.</p></div>
    </div>
    <div class="because">
      <p>The receptor fires constantly, whatever is happening around it, so it can never report anything. The construct is fine; the pairing of binder and host cell is not.</p>
      <p>${certainty === "probably"
        ? `We flag this as likely rather than certain: ${h.name} is a pig cell, and the match is with the pig version of ${t.name} rather than the human one.`
        : `Nothing here depends on the scaffold — switching scaffolds will not help.`}</p>
    </div>
    <div class="fixbar">
      ${alt ? `<span class="txt">Pick a cell that does not carry ${t.name}, such as <b>${alt.name}</b>.</span>
               <button class="btn" data-host="${alt.id}">Use ${alt.name}</button>`
            : `<span class="txt">No cell in the list avoids this. ${t.name} sits on almost every cell in the body —
               which is exactly what makes it a poor thing to sense, however well studied it is.</span>`}
    </div>
  </section>`;
}

function noData() {
  return `
  <section class="card verdict none">
    <div class="verdict-head">
      <span class="mark">–</span>
      <div><h2>No binders for ${state.target.name} yet</h2>
      <p>The pairing is sound, but nobody has added a checked, citable binder for this target.</p></div>
    </div>
    <div class="because"><p>In this mock, <b>TGF-β1</b> and <b>CD3ε</b> have candidates. Pick either to see a full result.</p></div>
  </section>`;
}

function passView(scaf) {
  const list = ranked(), rej = rejectedFor();
  const panes = { rec: recPane(scaf, list), cmp: cmpPane(scaf, list, rej), raw: rawPane(scaf, list) };
  return `
  <section class="card verdict ok">
    <div class="verdict-head">
      <span class="mark">✓</span>
      <div><h2>This should work</h2>
      <p>${list.length} designs passed every blocking check in ${state.host.name}. ${rej.length} were set aside.</p></div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="rec" aria-selected="${state.tab==="rec"}">Recommendation</button>
      <button class="tab" role="tab" data-tab="cmp" aria-selected="${state.tab==="cmp"}">Compare all</button>
      <button class="tab" role="tab" data-tab="raw" aria-selected="${state.tab==="raw"}">Sequence</button>
    </div>
    <div class="pane">${panes[state.tab]}</div>
  </section>`;
}

/* Warnings shown; passes folded away. */
function findingsHtml(list) {
  const row = f => `<div class="finding">
      <span class="dot ${f.sev}">${f.sev === "pass" ? "✓" : "!"}</span>
      <div><div class="f-title">${f.title}</div>
      ${f.detail ? `<div class="f-detail">${f.detail}</div>` : ""}</div></div>`;
  const warn = list.filter(f => f.sev === "warn"), pass = list.filter(f => f.sev === "pass");
  return warn.map(row).join("") +
    (pass.length ? `<details class="more"><summary>${pass.length} other checks passed</summary>${pass.map(row).join("")}</details>` : "");
}

function recPane(scaf, list) {
  const top = list[0];
  const c = state.chosen ? list.find(x => x.id === state.chosen) || top : top;
  const overridden = c.id !== top.id;
  const f = allFindings(c, scaf);
  const warn = f.filter(x => x.sev === "warn").length;

  return `
    ${overridden ? `<div class="override">
      <span>You picked ${c.name}${c.orientation ? " " + c.orientation : ""}. We suggested ${top.name}${top.orientation ? " " + top.orientation : ""}.</span>
      <button class="linkish" data-choose="">Go back to the suggestion</button></div>` : ""}

    <div class="rec-top">
      <div>
        <div class="rec-name">${c.name}${c.orientation ? ` <span style="color:var(--text-3);font-weight:400">· ${c.orientation}</span>` : ""}</div>
        <div class="rec-meta">${c.format} · ${c.origin} · ${c.binderLen} aa · ${c.evidence} · ${provBtn(c.prov, "source")}</div>
      </div>
      <div class="rec-actions">
        <button class="btn sm ghost" data-copy="binder">Copy binder</button>
        <button class="btn sm" data-download="fasta">Download</button>
      </div>
    </div>

    <div class="why-box">${c.why(state.host)}</div>

    <div class="sub">
      <h3>${warn ? `${warn} thing${warn === 1 ? "" : "s"} to keep an eye on` : "Nothing flagged"}</h3>
      ${findingsHtml(f)}
    </div>

    <div class="sub">
      <h3>Before you order anything</h3>
      <ul class="caveats">${c.caveats.map(x => `<li>${x}</li>`).join("")}</ul>
    </div>`;
}

function cmpPane(scaf, list, rej) {
  const rows = list.map(c => {
    const f = allFindings(c, scaf), warn = f.filter(x => x.sev === "warn");
    const open = state.open.has(c.id), chosen = state.chosen === c.id;
    return `
      <tr class="row ${c.rank === 1 ? "top" : ""} ${chosen ? "chosen" : ""}" data-row="${c.id}" aria-expanded="${open}">
        <td><span class="rank">${c.rank}</span></td>
        <td><span class="nm">${c.name}</span><div class="sm">${c.orientation || c.format}</div></td>
        <td>${c.origin}</td>
        <td>${warn.length ? warn.map(w => w.title.replace(/\.$/, "")).join("<br>") : "<span class='sm'>nothing</span>"}</td>
        <td>${c.rank === 1 ? "<span class='sm'>suggested</span>"
              : `<button class="btn sm ghost" data-choose="${c.id}">Use this</button>`}</td>
        <td><span class="chev">▶</span></td>
      </tr>
      ${open ? `<tr><td class="detail" colspan="6"><div class="detail-in">
        <div class="why-box">${c.why(state.host)}</div>
        <div class="sub"><h3>${c.binderLen} aa · ${c.evidence}</h3>${findingsHtml(f)}</div>
        <div class="sub"><h3>Before you order anything</h3>
          <ul class="caveats">${c.caveats.map(x => `<li>${x}</li>`).join("")}</ul></div>
      </div></td></tr>` : ""}`;
  }).join("");

  return `
    <div class="tablewrap"><table>
      <thead><tr><th></th><th>Binder</th><th>From</th><th>Keep an eye on</th><th></th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <p class="note" style="margin-top:12px">Open any row for the full reasoning. Ordered by how many
      concerns each carries, how directly its binding has been seen, and how human it is.</p>

    <div class="rejected">
      <h3 style="font-size:12.5px;color:var(--text-3);margin-bottom:8px;letter-spacing:.04em">SET ASIDE, AND WHY</h3>
      ${rej.map(r => `<div class="rej"><span class="x">✕</span>
        <div><div class="nm">${r.name}</div><div class="rs">${r.why}</div></div></div>`).join("")}
    </div>`;
}

/* ── Construct ───────────────────────────────────────────── */

function buildConstruct(binder, scafId) {
  const p = PARTS[scafId];
  const def = [
    { name:"signal peptide", cls:"sp",     seq:p.sp,        what:"Gets the receptor to the surface." },
    { name:"binder",         cls:"binder", seq:binder,      what:"Recognises the target. This is the part synbind designs." },
    { name:p.coreName,       cls:"core",   seq:p.core,      what:p.coreWhat },
    { name:"membrane part",  cls:"tmd",    seq:p.tmd,       what:"Sits in the membrane." },
    { name:"output",         cls:"output", seq:PARTS.output, what:"Let go when the receptor fires; switches on your gene." }
  ];
  let pos = 0;
  const segs = def.map(d => { const s = { ...d, start:pos, end:pos + d.seq.length }; pos += d.seq.length; return s; });
  return { segs, sequence: segs.map(s => s.seq).join(""), length: pos };
}

function annotate(con) {
  const W = 60, out = [];
  for (let i = 0; i < con.length; i += W) {
    let row = `<span class="ln">${String(i + 1).padStart(4, " ")}  </span>`, j = i;
    const end = Math.min(i + W, con.length);
    while (j < end) {
      const seg = con.segs.find(s => j >= s.start && j < s.end);
      const stop = Math.min(seg.end, end);
      row += `<span class="${seg.cls}" data-seg="${seg.name}">${con.sequence.slice(j, stop)}</span>`;
      j = stop;
    }
    out.push(row);
  }
  return out.join("\n");
}

function currentPick(list) {
  const l = list || ranked();
  return (state.chosen && l.find(x => x.id === state.chosen)) || l[0];
}

function resultJson(scaf) {
  const c = currentPick(), con = buildConstruct(c.binder, scaf.id);
  return {
    target: { gene:state.target.gene, accession:state.target.acc, modality:state.target.modality },
    host_cell: { id:state.host.id, species:state.host.species, transplanted:state.host.transplanted },
    scaffold: { id:`${scaf.id}_v1`, compatible_modalities:scaf.modalities },
    selected: { binder_id:c.id, orientation:c.orientation, length:con.length,
      chosen_by: state.chosen ? "user" : "synbind",
      segments: con.segs.map(s => ({ name:s.name, start:s.start, end:s.end,
        kind: s.cls === "binder" ? "binder" : "scaffold_part" })) },
    set_aside: rejectedFor().map(r => ({ binder_id:r.name, reason:r.rule })),
    generated_at: "2026-07-27T10:14:00Z",
    synbind_version: `0.0.0-${BUILD.tag}`
  };
}

function rawPane(scaf, list) {
  const c = currentPick(list), con = buildConstruct(c.binder, scaf.id);
  return `
    <div class="legend">${con.segs.map(s => `<span class="leg">
      <span class="swatch" style="background:var(--seg-${s.cls})"></span>${s.name}
      <span style="color:var(--text-3)">${s.end - s.start} aa</span></span>`).join("")}</div>

    <div class="seqbox"><div class="seq">${annotate(con)}</div></div>

    <p class="note" style="margin-top:12px">${con.length} amino acids, written from outside the cell
      inwards. The highlighted stretch is the only part that decides what the cell senses.</p>

    <details class="more" open><summary>Where each part came from</summary>
      <div class="tablewrap" style="margin-top:8px"><table>
        <thead><tr><th>Part</th><th>Position</th><th>What it does</th><th>Source</th></tr></thead>
        <tbody>${con.segs.map(s => `<tr>
          <td><span class="swatch" style="background:var(--seg-${s.cls});display:inline-block;margin-right:7px"></span><span class="nm">${s.name}</span></td>
          <td class="sm">${s.start + 1}–${s.end}</td>
          <td>${s.what}</td>
          <td>${provBtn(s.cls === "binder" ? c.prov : scaf.prov, s.cls === "binder" ? c.name : scaf.name)}</td>
        </tr>`).join("")}
        ${c.orientation ? `<tr><td colspan="3" class="sm">Inside the binder: ${c.orientation.replace("–", " — (G4S)₃ linker — ")}</td>
          <td>${provBtn("linker", "linker")}</td></tr>` : ""}</tbody>
      </table></div>
    </details>

    <details class="more"><summary>Machine-readable result (JSON format)</summary>
      <div class="exportbar">
        <button class="btn sm ghost" data-copy="json">Copy JSON</button>
        <button class="btn sm ghost" data-download="json">Download JSON</button>
      </div>
      <pre class="json">${esc(JSON.stringify(resultJson(scaf), null, 2))}</pre>
    </details>`;
}

/* ═══ Popover ════════════════════════════════════════════════ */

const pop = $("#pop");
function openPop(btn) {
  const rec = POP[btn.dataset.pop];
  if (!rec) return;
  pop.innerHTML = `<h4>${esc(rec.title)}</h4>` + (rec.text
    ? `<p>${esc(rec.text)}</p>`
    : `<dl>${Object.entries(rec.fields).map(([k, v]) =>
        `<dt>${esc(k)}</dt><dd class="${/^(Accession|Identifier|DOI|Sequence)$/.test(k) ? "mono" : ""}">${esc(v)}</dd>`).join("")}</dl>`);
  pop.style.display = "block";
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth;
  pop.style.top = (window.scrollY + r.bottom + 8) + "px";
  pop.style.left = Math.max(12, Math.min(window.scrollX + r.left, window.scrollX + window.innerWidth - w - 12)) + "px";
}

/* ═══ Copy / download ════════════════════════════════════════
   The mock warning travels with exported content, where the page
   banner cannot follow it. */

const MOCKLINE = "# MOCK DATA — invented, not a real sequence. Do not order or synthesise.";

function fastaText() {
  const scaf = SCAFFOLDS.find(s => s.id === state.scaffold);
  const c = currentPick(), con = buildConstruct(c.binder, scaf.id);
  const tag = `${c.name}${c.orientation ? "_" + c.orientation.replace("–", "-") : ""}`.replace(/\s+/g, "");
  const wrap = s => (s.match(/.{1,60}/g) || []).join("\n");
  return [MOCKLINE,
    `>${tag}_binder_MOCK  ${c.format}, ${c.binderLen} aa, anti-${state.target.name}`, wrap(c.binder),
    `>${tag}__${scaf.name}_construct_MOCK  ${con.length} aa`, wrap(con.sequence)].join("\n") + "\n";
}

function exportJson() {
  const scaf = SCAFFOLDS.find(s => s.id === state.scaffold);
  return JSON.stringify({ _warning: MOCKLINE.replace(/^# /, ""), ...resultJson(scaf) }, null, 2);
}

function binderFasta() {
  const c = currentPick();
  return `${MOCKLINE}\n>${c.name}_binder_MOCK\n` + (c.binder.match(/.{1,60}/g) || []).join("\n");
}

function copyText(text, msg) {
  const done = () => toast(msg);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
  else fallback(text, done);
}

function fallback(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("Copy blocked — select the sequence manually"); }
  ta.remove();
}

function downloadFile(kind) {
  const scaf = SCAFFOLDS.find(s => s.id === state.scaffold), c = currentPick();
  const isFasta = kind !== "json";
  const name = `${c.name}__${scaf.name}_MOCK.${isFasta ? "fasta" : "json"}`.replace(/\s+/g, "");
  const url = URL.createObjectURL(new Blob([isFasta ? fastaText() : exportJson()],
    { type: isFasta ? "text/plain" : "application/json" }));
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`Saved ${name}`);
}

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2400);
}

/* ═══ Wiring ═════════════════════════════════════════════════ */

function renderAll() { renderSelected(); renderHost(); renderScaffolds(); renderResult(); }

q.addEventListener("input", renderMenu);
q.addEventListener("focus", renderMenu);

$("#host").addEventListener("change", e => {
  state.host = HOSTS.find(h => h.id === e.target.value);
  state.chosen = null; state.open.clear();
  renderAll();
});

document.addEventListener("click", e => {
  const t = e.target;

  const popBtn = t.closest("[data-pop]");
  if (popBtn) { openPop(popBtn); e.stopPropagation(); return; }

  const choose = t.closest("[data-choose]");
  if (choose) {
    state.chosen = choose.dataset.choose || null;
    state.tab = "rec"; state.open.clear();
    renderResult(); e.stopPropagation(); return;
  }

  const opt = t.closest("[data-target]");
  if (opt) { pickTarget(opt.dataset.target); return; }

  if (t.closest("[data-clear]")) {
    state.target = null; state.scaffold = null; state.chosen = null;
    q.value = ""; q.focus();
    $("#step2").hidden = true; $("#step3").hidden = true;
    renderSelected(); renderResult(); return;
  }

  const hostBtn = t.closest("[data-host]");
  if (hostBtn) { state.host = HOSTS.find(h => h.id === hostBtn.dataset.host); renderAll(); return; }

  const scaf = t.closest("[data-scaffold]");
  if (scaf) { state.scaffold = scaf.dataset.scaffold; state.tab = "rec"; state.open.clear(); state.chosen = null;
              renderScaffolds(); renderResult(); return; }

  const sw = t.closest("[data-switch]");
  if (sw) { state.scaffold = sw.dataset.switch; state.tab = "rec"; renderScaffolds(); renderResult(); return; }

  const tab = t.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; renderResult(); return; }

  const row = t.closest("[data-row]");
  if (row) { const id = row.dataset.row;
             state.open.has(id) ? state.open.delete(id) : state.open.add(id);
             renderResult(); return; }

  const cp = t.closest("[data-copy]");
  if (cp) { cp.dataset.copy === "json" ? copyText(exportJson(), "Copied JSON")
                                       : copyText(binderFasta(), "Copied"); return; }

  const dl = t.closest("[data-download]");
  if (dl) { downloadFile(dl.dataset.download); return; }

  if (!t.closest("#pop")) pop.style.display = "none";
  if (!t.closest(".picker")) menu.hidden = true;
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { pop.style.display = "none"; menu.hidden = true; }
});

$("#build").textContent = `${BUILD.tag} · ${BUILD.date}`;
renderHost();
renderScaffolds();
</script>
</body>
</html>
